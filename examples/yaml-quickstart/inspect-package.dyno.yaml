name: yaml-quickstart
harnesses:
  - claude-code
scenarios:
  - name: inspect package scripts (yaml)
    prompt: >-
      Use a shell command that reads package.json and tell me whether a test
      script exists.
    setup:
      - |
        cat > package.json <<'JSON'
        {
          "name": "dynobox-yaml-smoke",
          "scripts": {
            "test": "vitest run"
          }
        }
        JSON
    assertions:
      - label: uses shell
        type: tool.called
        tool: shell
      - label: reads package.json
        type: tool.called
        tool: shell
        command:
          includes: package.json
      - type: artifact.contains
        path: package.json
        text: vitest run
