name: yaml-quickstart
harnesses:
  - claude-code
scenarios:
  - name: inspect package scripts (yaml)
    prompt: >-
      Use cat package.json and tell me whether a test script exists.
    setup:
      - |
        cat > package.json <<'JSON'
        {
          "name": "dynobox-yaml-smoke",
          "scripts": {
            "test": "vitest run"
          }
        }
        JSON
    assertions:
      - label: reads package.json
        type: command.called
        executable: cat
        command:
          args:
            - package.json
      - type: artifact.contains
        path: package.json
        text: vitest run
