name: http-assertion-yaml
harnesses:
  - id: claude-code
    permissionMode: default
endpoints:
  getHttpBinStatus:
    method: GET
    url: https://httpbin.org/status/204
  getHttpBinAnything:
    method: GET
    url: https://httpbin.org/anything
scenarios:
  - name: fetch expected endpoint
    prompt: >-
      Use curl to request https://httpbin.org/status/204, then report the
      status code.
    assertions:
      - kind: http.called
        endpoint: getHttpBinStatus
        status: 204
  - name: avoid unrelated endpoint
    prompt: >-
      Use curl to request https://httpbin.org/status/204. Do not request
      /anything.
    assertions:
      - kind: http.called
        endpoint: getHttpBinStatus
        status: 204
      - kind: http.notCalled
        endpoint: getHttpBinAnything
